apiVersion: batch/v1
kind: Job
metadata:
  name: fix-ownership-1000
  namespace: downloads
spec:
  template:
    spec:
      containers:
      - name: fixer
        image: busybox
        # Este comando cambia el dueño de TODO tu disco de 100GB al usuario 1000
        command: ["sh", "-c", "echo 'Cambiando permisos...' && chown -R 1000:1000 /data && echo 'Hecho!'"]
        volumeMounts:
        - name: data
          mountPath: /data
        securityContext:
          runAsUser: 0 # Root necesario para cambiar permisos
      restartPolicy: OnFailure
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data