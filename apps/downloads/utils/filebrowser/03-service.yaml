apiVersion: v1
kind: Service
metadata:
  name: filebrowser
  namespace: downloads
  labels:
    app.kubernetes.io/name: filebrowser
    app.kubernetes.io/component: file-manager  # Optional: aids in filtering and organization

spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: filebrowser   # Must match the labels used in your Deployment's pod template
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80                      # Matches the container's listening port
      nodePort: 30081                     # Explicitly set; ensure this port is open in your firewall